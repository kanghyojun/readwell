<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { max-width: 460px; margin: 40px auto; padding: 0 16px;
      font: 15px/1.6 -apple-system, system-ui, sans-serif; color: #1c1c1a; }
    label { display: block; font-weight: 600; margin-bottom: 6px; }
    input { width: 100%; padding: 9px; font: inherit; box-sizing: border-box;
      border: 1px solid #ddd; border-radius: 6px; }
    button { margin-top: 12px; padding: 9px 16px; font: inherit; font-weight: 600;
      color: #fff; background: #7a5cff; border: none; border-radius: 6px; cursor: pointer; }
    .hint { color: #6b6b66; font-size: 13px; margin: 6px 0 0; }
    #saved { color: #2a8a3e; margin-left: 10px; }
  </style>
</head>
<body>
  <h1>readwell 설정</h1>
  <label for="endpoint">웹서비스 주소</label>
  <input id="endpoint" type="text" placeholder="http://localhost:2100">
  <p class="hint">기본은 로컬 서버 http://localhost:2100.
    원격은 http://100.99.117.44:2100 (Tailscale로 hops-dev-2).
    다른 호스트를 쓰려면 manifest.json의 host_permissions에도 추가해야 합니다.
    이때 포트는 쓰지 마세요.</p>
  <button id="save">저장</button><span id="saved"></span>
  <script src="options.js"></script>
</body>
</html>
