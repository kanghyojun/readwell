<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <style>
    body { width: 260px; margin: 0; padding: 14px;
      font: 14px/1.5 -apple-system, system-ui, sans-serif; color: #1c1c1a; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    #read { width: 100%; padding: 10px; font: inherit; font-weight: 600;
      color: #fff; background: #7a5cff; border: none; border-radius: 8px; cursor: pointer; }
    #read:disabled { opacity: .5; cursor: wait; }
    #status { margin-top: 10px; font-size: 12px; color: #6b6b66; min-height: 16px; }
    .foot { margin-top: 12px; font-size: 12px; }
    .foot a { color: #7a5cff; text-decoration: none; }
  </style>
</head>
<body>
  <h1>readwell</h1>
  <button id="read">이 페이지 읽기</button>
  <div id="status"></div>
  <div class="foot"><a href="#" id="opt">서버 주소 설정</a></div>
  <script src="popup.js"></script>
</body>
</html>
