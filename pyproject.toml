[project]
name = "readwell"
version = "0.1.0"
description = "긴 글을 요약으로 뭉개지 않고 원문 회귀용 색인·검증으로 읽는 개인 도구"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "trafilatura>=1.12",
    "httpx>=0.27",
    "claude-agent-sdk>=0.1.0",
    "jinja2>=3.1",
    "markdown>=3.7",
    "python-slugify>=8.0",
    "pydantic>=2.9",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
